<div class="register-container">
  <section class="register-card">
    <span class="brand-mark">HS</span>
    <h2 class="title">Create Account</h2>
    <p class="subtitle">Register to access the hotel workspace.</p>

    <form #registerForm="ngForm" (ngSubmit)="register(registerForm)">
      <label>
        Username
        <input type="text" name="username" [(ngModel)]="form.username" placeholder="Full name" autocomplete="name"
          required />
      </label>

      <label>
        Email
        <input type="email" name="email" [(ngModel)]="form.email" placeholder="name@hotel.com" autocomplete="email"
          email required />
      </label>

      <label>
        Password
        <input type="password" name="password" [(ngModel)]="form.password" placeholder="Create password"
          autocomplete="new-password" minlength="6" required />
      </label>

      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isSubmitting || registerForm.invalid">
        {{ isSubmitting ? 'Creating...' : 'Register' }}
      </button>
    </form>

    <p class="footer-text">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </section>
</div>
