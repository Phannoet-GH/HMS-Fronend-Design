<main class="module-page">
  <header class="page-header">
    <div>
      <h1>Inventory</h1>
      <p>Monitor hotel supplies, stock levels, reorder points, and usage.</p>
    </div>
    <button type="button">Add Item</button>
  </header>

  <section class="summary-grid">
    <article><span>Total Items</span><strong>0</strong></article>
    <article><span>Low Stock</span><strong>0</strong></article>
    <article><span>Out of Stock</span><strong>0</strong></article>
    <article><span>Monthly Usage</span><strong>$0</strong></article>
  </section>

  <section class="content-grid">
    <form class="panel form-panel">
      <h2>Stock Adjustment</h2>
      <label>Item <input placeholder="Item name or SKU" /></label>
      <label>Quantity <input type="number" placeholder="0" /></label>
      <label>Reason <select><option>Restock</option><option>Usage</option><option>Damage</option></select></label>
      <button type="button">Update Stock</button>
    </form>

    <section class="panel">
      <div class="section-header"><h2>Stock Watchlist</h2><button class="secondary" type="button">Reorder</button></div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Item</th><th>Category</th><th>On Hand</th><th>Reorder At</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td colspan="5">No inventory database endpoint is configured yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </section>
</main>
