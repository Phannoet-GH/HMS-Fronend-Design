<main class="module-page">
  <header class="page-header">
    <div>
      <h1>Room Services</h1>
      <p>Track in-room dining, housekeeping add-ons, and guest requests.</p>
    </div>
    <button type="button">New Service</button>
  </header>

  <section class="summary-grid">
    <article><span>Open Orders</span><strong>0</strong></article>
    <article><span>In Progress</span><strong>0</strong></article>
    <article><span>Completed Today</span><strong>0</strong></article>
    <article><span>Revenue</span><strong>$0</strong></article>
  </section>

  <section class="content-grid">
    <form class="panel form-panel">
      <h2>Create Service Order</h2>
      <label>Room <input placeholder="Room number" /></label>
      <label>Service Type <select><option>Dining</option><option>Housekeeping</option><option>Laundry</option></select></label>
      <label>Priority <select><option>Normal</option><option>Urgent</option></select></label>
      <label>Notes <textarea rows="4" placeholder="Guest request details"></textarea></label>
      <button type="button">Save Order</button>
    </form>

    <section class="panel">
      <div class="section-header"><h2>Service Queue</h2><button class="secondary" type="button">Refresh</button></div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Room</th><th>Service</th><th>Assigned To</th><th>Status</th><th>Amount</th></tr></thead>
          <tbody>
            <tr><td colspan="5">No room service database endpoint is configured yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </section>
</main>
